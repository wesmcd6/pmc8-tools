    <script>
        navigator.serviceWorker.register('service-worker.js');
        // Auto-apply the user's saved language as soon as Blazor's first
        // render lands. The MutationObserver inside i18n.js will keep
        // up with subsequent renders. Idempotent — safe to no-op when
        // saved lang is 'en' (the source).
        document.addEventListener('DOMContentLoaded', function () {
            if (window.eslI18n && typeof window.eslI18n.init === 'function') {
                window.eslI18n.init();
            }
        });
    </script>
    <script>
        function saveSettings(json) { localStorage.setItem('eslite_settings', json); }
        function loadSettings() { return localStorage.getItem('eslite_settings'); }
        function saveCustomTargets(json) { localStorage.setItem('eslite_custom_targets', json); }
        function loadCustomTargets() { return localStorage.getItem('eslite_custom_targets'); }
        // Returns a Promise resolving true if deviceorientation events with
        // non-null α/β/γ arrive within timeoutMs. On iOS 13+ where
        // DeviceOrientationEvent.requestPermission exists, the sensors are
        // gated behind a user-gesture prompt — we can't probe without
        // asking, so we optimistically assume sensors are present.
        function probeSensors(timeoutMs) {
            return new Promise(function (resolve) {
                if (typeof DeviceOrientationEvent !== 'undefined'
                    && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    resolve(true); return;
                }
                var done = false;
                function handler(e) {
                    if (done) return;
                    if (e.alpha !== null || e.beta !== null || e.gamma !== null) {
                        done = true;
                        window.removeEventListener('deviceorientation', handler);
                        resolve(true);
                    }
                }
                window.addEventListener('deviceorientation', handler);
                setTimeout(function () {
                    if (done) return;
                    done = true;
                    window.removeEventListener('deviceorientation', handler);
                    resolve(false);
                }, timeoutMs);
            });
        }
        function getGpsPosition() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) { reject(new Error('GPS unavailable')); return; }
                navigator.geolocation.getCurrentPosition(
                    pos => resolve([pos.coords.latitude, pos.coords.longitude]),
                    err => reject(new Error(err.code === 1 ? 'denied' : err.code === 2 ? 'unavailable' : 'timeout')),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }
    </script>
